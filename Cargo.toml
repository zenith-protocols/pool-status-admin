[package]
name = "pool-status-admin"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Robeartt"]
repository = "https://github.com/zenith-protocols/pool-status-admin"
description = "Blend pool admin limited to the pool status, built on OpenZeppelin Stellar Contracts"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "25.3.0"
stellar-access = "=0.7.0"
stellar-macros = "=0.7.0"

[dev-dependencies]
soroban-sdk = { version = "25.3.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
